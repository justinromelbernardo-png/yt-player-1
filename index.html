<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>Video player</title>
<style>
html,body{margin:0;height:100%;background:#000}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{color:#bbb;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:0 20px;margin-top:40vh}
</style>
</head>
<body>
<script>
// YouTube player page for offline study portals.
// A portal opened from a downloaded file has no web address, so YouTube refuses to play inside it.
// The portal loads this page instead (e.g. .../#v=VIDEO_ID&start=90); this page then loads YouTube,
// which sees this site's address and plays normally. It only ever shows YouTube videos.
(function(){
  var h = new URLSearchParams(location.hash.slice(1));
  var v = h.get("v") || "", list = h.get("list") || "", start = parseInt(h.get("start") || "0", 10) || 0;
  if (!/^[\w-]{6,20}$/.test(v)) v = "";
  if (list && !/^[\w-]{2,64}$/.test(list)) list = "";
  if (!v && !list){ document.body.innerHTML = "<p>This page plays YouTube videos for a study portal. No video was selected.</p>"; return; }
  var f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + (v || "videoseries") + "?rel=0&playsinline=1" +
          (start ? "&start=" + start : "") + (list ? "&list=" + encodeURIComponent(list) : "");
  f.title = "YouTube video";
  f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
})();
</script>
</body>
</html>
